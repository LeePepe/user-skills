# GTT runtime profiles — role to model, CLI, and launch parameters.
version: 1
updated: 2026-10-25

tiers:
  strong: [team_lead, arbitration]
  mid: [planner, planner_reviewer, code_reviewer, writer_escalated]
  worker: [writer, explorer, mechanical]
  research: [research_primary, research_co]

vendors:
  opus: anthropic
  gpt-6.1-sol: openai
  gpt-5.6-luna: openai
  mai-code-2-flash: microsoft
  gemini-4-argon: google
  gemini-3.8-flash: google
  kimi-k3-high: moonshot
  composer-2.5: cursor

common:
  herdr_kind_map:
    claude: claude
    codex: codex
    copilot: copilot
    cursor-agent: cursor
  codex:
    service_tier: default
    always_pass_model: true
  cursor_cli_binary: cursor-agent
  failure_escalation:
    round_1_fail: same_writer
    round_2_fail: writer_escalated
    after_round_2_fail: replan_blocked
  forbidden_flags:
    - "--yolo"
    - "--force"
    - "--dangerously-bypass-approvals-and-sandbox"
    - "--dangerously-skip-permissions"
    - "--allow-all-tools"
    - "--allow-all-paths"
    - "--allow-all"
  readonly_flags:
    codex: "exec -s read-only"
    cursor_agent: "--mode ask"
    copilot: "--deny-tool write --deny-tool shell --no-ask-user"

machines:
  mac-mini:
    allowed_cli: [claude, codex, cursor-agent, copilot]
    # Strong-tier Claude weekly quota precheck (team_lead + arbitration only).
    # Consumers resolve the role's profile list, then BEFORE herdr agent start:
    #   1) If list[0] matches quota_precheck.primary_match (cli: claude), measure weekly_remaining_pct.
    #   2) If weekly_remaining_pct < threshold_lt OR measurement fails (on_measure_failure), skip list[0]
    #      and start on list[1] (use_next) — do not start Claude and fail over later.
    # MacBook strong profiles do not use Claude; no precheck there.
    strong:
      quota_precheck:
        roles: [team_lead, arbitration]
        primary_match: {cli: claude}
        metric: weekly_remaining_pct
        threshold_lt: 20
        action: use_next
        on_measure_failure: use_next
        backup_entry: {cli: copilot, model: gemini-4-argon}
        measurement:
          weekly_remaining_pct: "100 - rate_limits.seven_day.used_percentage"
          statusline_field: rate_limits.seven_day.used_percentage
          interactive_command: /usage
          interactive_note: "Current week (all models) shows used %; weekly_remaining_pct = 100 - used"
          cache_file: ~/.config/claude/gtt-weekly-remaining-pct.json
          cache_max_age_seconds: 900
          cache_schema:
            weekly_remaining_pct: integer
            observed_at: unix_epoch_seconds
      team_lead:
        - {cli: claude, model: opus, vendor: anthropic, flags: "--model opus --allowedTools Bash Read Write Edit Grep Glob"}
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
      arbitration:
        - {cli: claude, model: opus, vendor: anthropic}
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    mid:
      planner: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, sandbox: danger-full-access, flags: "-m gpt-6.1-sol -c model_context_window=1000000 -s danger-full-access -a never", writes: handoff-only}
      planner_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
      code_reviewer:
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, flags: "exec -m gpt-6.1-sol -c model_context_window=1000000 -s read-only"}
      writer_escalated: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, sandbox: danger-full-access, flags: "-m gpt-6.1-sol -c model_context_window=1000000 -s danger-full-access -a never"}
    worker:
      writer:
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, flags: "--model gpt-5.6-luna"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash"}
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash"}
        - {cli: cursor-agent, model: composer-2.5, vendor: cursor, flags: "--model composer-2.5"}
      explorer:
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, flags: "--model gpt-5.6-luna --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: cursor-agent, model: composer-2.5, vendor: cursor, flags: "--model composer-2.5 --mode ask"}
      mechanical:
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, effort: low, flags: "--model gpt-5.6-luna --reasoning-effort low"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash"}
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash"}
        - {cli: cursor-agent, model: composer-2.5, vendor: cursor, flags: "--model composer-2.5"}
    research:
      research_primary: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
      research_co:
        - {cli: cursor-agent, model: kimi-k3-high, vendor: moonshot, flags: "--model kimi-k3-high --mode ask"}
        - {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, flags: "-m gpt-6.1-sol -c model_context_window=1000000"}
      research_arbiter: {ref: arbitration}

  macbook:
    allowed_cli: [codex, copilot]
    strong:
      team_lead: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
      arbitration: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    mid:
      planner: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, flags: "-m gpt-6.1-sol -c model_context_window=1000000", writes: handoff-only}
      planner_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
      code_reviewer:
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, flags: "exec -m gpt-6.1-sol -c model_context_window=1000000 -s read-only"}
      writer_escalated: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, sandbox: danger-full-access, flags: "-m gpt-6.1-sol -c model_context_window=1000000 -s danger-full-access -a never"}
    worker:
      writer:
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, flags: "--model gpt-5.6-luna"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash"}
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash"}
      explorer:
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash --deny-tool write --deny-tool shell --no-ask-user"}
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, flags: "--model gpt-5.6-luna --deny-tool write --deny-tool shell --no-ask-user"}
      mechanical:
        - {cli: copilot, model: gpt-5.6-luna, vendor: openai, effort: low, flags: "--model gpt-5.6-luna --reasoning-effort low"}
        - {cli: copilot, model: mai-code-2-flash, vendor: microsoft, flags: "--model mai-code-2-flash"}
        - {cli: copilot, model: gemini-3.8-flash, vendor: google, flags: "--model gemini-3.8-flash"}
    research:
      research_primary: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --deny-tool write --deny-tool shell --no-ask-user"}
      research_co: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, flags: "-m gpt-6.1-sol -c model_context_window=1000000"}
      research_arbiter: {ref: arbitration}

notes:
  mac_mini_strong_claude_quota: >
    On mac-mini only, before starting strong team_lead or arbitration when the first
    profile entry is claude/opus, run quota_precheck (weekly_remaining_pct < 20 or unreadable
    → start on copilot/gemini-4-argon). See bots-and-agents.md Measurement.
  model_assignment: >
    strong uses opus with claude and gemini-4-argon with copilot;
    mid uses gpt-6.1-sol with codex and gemini-4-argon with copilot;
    worker uses the listed copilot models and composer-2.5 with cursor-agent;
    research uses gemini-4-argon with copilot and kimi-k3-high with cursor-agent.
