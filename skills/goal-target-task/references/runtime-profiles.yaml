# GTT runtime profiles —— 角色 → 模型 / CLI / 启动参数的唯一源头
#
# 适用范围：本环境（Owner tianpei 的 Mac mini 与 MacBook）。换环境时复制本文件改机器节即可，
# 合同（SKILL.md）与 bots-and-agents.md、ledger.md 只引用档位和角色名，不写具体模型。
# 权限、审批与审查规则以 SKILL.md 为准；本文件里的工具能力不扩大合同授权。
#
# 硬规则（同时写在 SKILL.md「CLI 用法」）：
#   1. Reviewer 必须与被审者使用不同家（vendor）的模型；Planner 的 Reviewer 尤其如此。
#   2. 每次启动显式带模型参数（codex 用 -m；copilot 与 cursor-agent 用 --model，cursor-agent 不认 -m），不依赖 CLI 默认模型。
#   3. 降级 = 同一档位、同一角色内换一个可用模型（仍须满足规则 1），并在 R10 回执写明原模型、新模型和原因。
#   4. forbidden_flags 中的参数在 GTT 内一律不用。
#
# 核对记录：
#   - Mac mini 2026-10-21：`cursor-agent --list-models`（cursor-agent 2026.10.19）列出
#     gemini-4-argon-{low,medium,high}、grok-4.7-{low,medium,high,xhigh}[-fast]、kimi-k3-{low,high,max}、composer-2.5；
#     cursor-agent 里没有不带后缀的 `gemini-4-argon`。codex-cli 0.163.0，Copilot CLI 1.0.100。
#   - MacBook 2026-10-21（Joy 实测，Copilot CLI 1.0.101）：`gemini-4-argon`、`gemini-3.8-flash` 可用，
#     `gemini-3.7-flash` 不可用；只读参数下退出码 0、无文件改动。

version: 1
updated: 2026-10-23
# Owner 2026-10-22（Hotty 转述 tianpei「就给 codex 所有 danger-full-access」）：Codex 用 -s danger-full-access，不列入 forbidden_flags。

# 档位：合同和分工文档只引用这里的档位/角色名
tiers:
  strong:   [team_lead, arbitration]          # 分配（TL）与裁决：Reviewer 分歧、调研下结论
  mid:      [planner, planner_reviewer, code_reviewer, writer_escalated]  # writer_escalated 用于复杂跨模块/并发任务或 V3 第 2 轮修复升档
  worker:   [writer, explorer, mechanical]
  research: [research_primary, research_co]   # 旁听（research_co）只在调研中作为正式成员参与，由 strong 档裁决；调研以外不设旁听

vendors:            # 用于核对「Reviewer 不同家」
  opus: anthropic
  gpt-6.1-sol: openai
  gpt-5.6-luna: openai
  gemini-4-argon: google
  gemini-3.8-flash: google
  kimi-k3-high: moonshot

common:
  herdr_kind_map:
    claude: claude
    codex: codex
    copilot: copilot
    cursor-agent: cursor       # herdr kind is cursor, not the cursor-agent binary name
  codex:
    service_tier: default        # 写进 ~/.codex/config.toml；TUI Fast 模式发 priority 会被 Copilot/Raven 拒绝
    always_pass_model: true      # codex 默认模型（gpt-6-luna）不在本表，禁止依赖
  cursor_cli_binary: cursor-agent  # 不用裸 `agent`（可能解析到其他 CLI）
  failure_escalation:
    round_1_fail: same_writer              # V3 第 1 轮 FAIL 由原 writer 修复
    round_2_fail: writer_escalated         # V3 第 1 轮修复后复审仍 FAIL（进入第 2 轮修复），升档至 writer_escalated 带新鲜上下文接手
    after_round_2_fail: replan_blocked     # 两轮修复仍不过，Task 置 blocked 并退回定义方重规划
  forbidden_flags:
    - "--yolo"
    - "--force"                                     # cursor-agent，等同 --yolo
    - "--dangerously-bypass-approvals-and-sandbox"  # codex
    - "--dangerously-skip-permissions"              # claude
    - "--allow-all-tools"                           # copilot
    - "--allow-all-paths"                           # copilot
    - "--allow-all"                                 # copilot
  readonly_flags:
    codex: "exec -s read-only"
    cursor_agent: "--mode ask"          # 或 --mode plan；均为只读
    copilot: "--deny-tool write --deny-tool shell --no-ask-user"

machines:
  mac-mini:
    allowed_cli: [claude, codex, cursor-agent, copilot]
    team_lead:
      - {cli: claude, model: opus, vendor: anthropic,
         flags: "--model opus --allowedTools Bash Read Write Edit Grep Glob"}  # 不开 bypass permissions
      - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high,
         context: long_context, context_window: 983k,
         flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    arbitration:
      - {cli: claude, model: opus, vendor: anthropic}
      - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high,
         context: long_context, context_window: 983k,
         flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    planner:          {cli: codex, model: gpt-6.1-sol, vendor: openai, sandbox: danger-full-access, writes: handoff-only}
    planner_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google, flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}  # Owner 2026-10-21 决定：Cursor 额度不含 Gemini 4 Argon，改走 copilot 只读
    code_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google,
                    flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}
    writer: {cli: codex, model: gpt-5.6-luna, vendor: openai, sandbox: danger-full-access,
             flags: "-s danger-full-access -a never"}
    writer_escalated: # V3 第 2 轮修复升档或高复杂度/并发切片
      - {cli: codex, model: gpt-6.1-sol, vendor: openai, sandbox: danger-full-access,
         flags: "-s danger-full-access -a never"}
    explorer:
      - {cli: copilot, model: gemini-3.8-flash, vendor: google,
         flags: "--model gemini-3.8-flash --deny-tool write --deny-tool shell --no-ask-user"}          # 快速/长上下文只读探查
      - {cli: copilot, model: gemini-4-argon, vendor: google,
         flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}            # 大规模代码库/文档长上下文只读探查
      - {cli: codex, model: gpt-5.6-luna, vendor: openai, sandbox: danger-full-access, writes: handoff-only}
    mechanical:
      - {cli: codex, model: gpt-5.6-luna, vendor: openai, effort: low}
    research_primary: {cli: codex, model: gpt-6.1-sol, vendor: openai}
    research_co: {cli: cursor-agent, model: kimi-k3-high, vendor: moonshot,
                  flags: "--model kimi-k3-high --mode ask"}
    research_arbiter: {ref: arbitration}

  macbook:
    allowed_cli: [codex, copilot]        # codex 经 Raven；不使用 claude / cursor-agent / Kimi / Grok
    team_lead:
      - {cli: codex, model: gpt-6.1-sol, vendor: openai}
      - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high,
         context: long_context, context_window: 983k,
         flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    arbitration:
      - {cli: codex, model: gpt-6.1-sol, vendor: openai}   # 与 TL 分开会话
      - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high,
         context: long_context, context_window: 983k,
         flags: "--model gemini-4-argon --reasoning-effort high --context long_context"}
    planner:          {cli: codex, model: gpt-6.1-sol, vendor: openai, writes: handoff-only}
    planner_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google,
                       flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}
    code_reviewer:    {cli: copilot, model: gemini-4-argon, vendor: google,
                       flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}
    writer:           {cli: codex, model: gpt-5.6-luna, vendor: openai, sandbox: danger-full-access,
                       flags: "-s danger-full-access -a never"}
    writer_escalated: {cli: codex, model: gpt-6.1-sol, vendor: openai, sandbox: danger-full-access,
                       flags: "-s danger-full-access -a never"}          # V3 第 2 轮修复升档或高复杂度/并发切片
    explorer:
      - {cli: copilot, model: gemini-3.8-flash, vendor: google,
         flags: "--model gemini-3.8-flash --deny-tool write --deny-tool shell --no-ask-user"}          # 快速/长上下文只读探查
      - {cli: copilot, model: gemini-4-argon, vendor: google,
         flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}            # 大规模代码库/文档长上下文只读探查
      - {cli: codex, model: gpt-5.6-luna, vendor: openai, writes: handoff-only}
    mechanical:       {cli: codex, model: gpt-5.6-luna, vendor: openai, effort: low}
    research_primary: {cli: codex, model: gpt-6.1-sol, vendor: openai}
    research_co:      {cli: copilot, model: gemini-4-argon, vendor: google,
                       flags: "--model gemini-4-argon --deny-tool write --deny-tool shell --no-ask-user"}
    research_arbiter: {ref: arbitration}
    reviewer_fallback: {cli: copilot, model: gemini-3.8-flash, vendor: google}   # Owner 2026-10-21 已确认：gemini-4-argon 不可用时的同档降级
    # Gemini 在 MacBook 用于只读角色（Reviewer、Explorer 只读探查与调研旁听），写入角色只用 GPT。

notes:
  owner_2026_10_23: >
    Owner 2026-10-23 决定：strong 档两边均增加 copilot gemini-4-argon（high, 983k long_context）备选；
    claude 仅用于 strong；删除非 research 的所有 cursor-agent，仅在 research_co 中保留 cursor-agent + kimi-k3-high。
  code_reviewer_default: >
    Owner 2026-10-23：Mac mini code Reviewer 仅使用 Copilot gemini-4-argon。
  writer_sandbox: >
    Owner 2026-10-22（Hotty 转述）：所有 Codex 角色使用 -s danger-full-access（profile 中 sandbox: danger-full-access，
    写者带 -s danger-full-access -a never）。此前 workspace-write + --add-dir <主仓库>/.git 试点已废止。
    背景：worktree 写者需触及 <主仓库>/.git/worktrees/...，read-only/workspace-write 不足时曾依赖 danger-full-access。
  failure_escalation: >
    V3 失败自动升档（Failure-Tier Escalation）：标准 writer（gpt-5.6-luna）在第 1 轮审查 FAIL 后自行修复一次；
    若第 1 轮修复后复审仍 FAIL（进入第 2 轮修复），或遇到高复杂度跨模块/并发问题，由 TL 改派 writer_escalated
    （codex gpt-6.1-sol 带 -s danger-full-access -a never）以新鲜上下文接手第 2 轮修复；
    Reviewer 保持异构（google gemini-4-argon），满足跨厂商（cross-vendor）硬规则。
  sandbox_nesting: >
    Codex CLI 0.163：danger-full-access 下 subagent 可再派一层，read-only 下第二层被拒；R6 默认采用 1-Hop Flat Tree，由 TL 统一扁平派发所有 subagent，写者与 Reviewer 默认不再递归派发下级 subagent。
