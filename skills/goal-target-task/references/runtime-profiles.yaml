# GTT runtime profiles — role to model, CLI, and launch parameters.
version: 1
updated: 2026-10-26

tiers:
  strong: [team_lead, arbitration]
  mid: [planner, planner_reviewer, code_reviewer, writer_escalated]
  worker: [writer, explorer, pr_monitor, mechanical]
  research: [research_primary, research_co]

vendors:
  opus: anthropic
  gpt-6.1-sol: openai
  gpt-5.6-luna: openai
  mai-code-2-flash: microsoft
  gemini-4-argon: google
  kimi: moonshot

common:
  herdr_kind_map:
    claude: claude
    codex: codex
    copilot: copilot
    cursor-agent: cursor
  codex:
    service_tier: default
    always_pass_model: true
  cursor_cli_binary: cursor-agent
  failure_escalation:
    round_1_fail: same_writer
    round_2_fail: writer_escalated
    after_round_2_fail: replan_blocked
  forbidden_flags:
    - "--yolo"
    - "--force"
    - "--dangerously-bypass-approvals-and-sandbox"
    - "--dangerously-skip-permissions"
    - "--allow-all-tools"
    - "--allow-all-paths"
    - "--allow-all"
  copilot_allowlist:
    # macOS temp roots are listed as both the symlink and the /private realpath.
    # Copilot realpath-dedupes the pair; the static path scan still needs both literals.
    trusted_dirs:
      - "~/Development"
      - "~/.copilot"
      - "~/.agents"
      - "~/.codex"
      - "~/orca"
      - "/tmp"
      - "/private/tmp"
      - "/var/folders"
      - "/private/var/folders"
    write_flags: "--allow-tool write --allow-tool shell --allow-tool url --deny-tool 'shell(rm -rf /:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"
    readonly_receipt_flags: "--allow-tool write --allow-tool url --allow-tool 'shell(git:*)' --allow-tool 'shell(gh:*)' --allow-tool 'shell(env:*)' --allow-tool 'shell(python3:*)' --allow-tool 'shell(jq:*)' --allow-tool 'shell(rg:*)' --allow-tool 'shell(shasum:*)' --deny-tool 'shell(git commit:*)' --deny-tool 'shell(git push:*)' --deny-tool 'shell(git merge:*)' --deny-tool 'shell(git rebase:*)' --deny-tool 'shell(git reset:*)' --deny-tool 'shell(git checkout:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"
    pr_monitor_flags: "--allow-tool write --allow-tool url --allow-tool 'shell(gh:*)' --allow-tool 'shell(git:*)' --allow-tool 'shell(env:*)' --allow-tool 'shell(python3:*)' --allow-tool 'shell(jq:*)' --allow-tool 'shell(sleep:*)' --allow-tool 'shell(date:*)' --allow-tool 'shell(shasum:*)' --allow-tool 'shell(herdr:*)' --deny-tool 'shell(git commit:*)' --deny-tool 'shell(git push:*)' --deny-tool 'shell(git reset:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"
  readonly_flags:
    codex: "exec -s read-only"
    cursor_agent: "--mode ask"
    copilot: "--allow-tool write --allow-tool url --allow-tool 'shell(git:*)' --allow-tool 'shell(gh:*)' --allow-tool 'shell(env:*)' --allow-tool 'shell(python3:*)' --allow-tool 'shell(jq:*)' --allow-tool 'shell(rg:*)' --allow-tool 'shell(shasum:*)' --deny-tool 'shell(git commit:*)' --deny-tool 'shell(git push:*)' --deny-tool 'shell(git merge:*)' --deny-tool 'shell(git rebase:*)' --deny-tool 'shell(git reset:*)' --deny-tool 'shell(git checkout:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"

machines:
  mac-mini:
    allowed_cli: [claude, codex, cursor-agent, copilot]
    # Strong-tier Claude weekly quota precheck (team_lead + arbitration only).
    # Consumers resolve the role's profile list, then BEFORE herdr agent start:
    #   1) If list[0] matches quota_precheck.primary_match (cli: claude), measure weekly_remaining_pct.
    #   2) If weekly_remaining_pct < threshold_lt OR measurement fails (on_measure_failure), skip list[0]
    #      and start on list[1] (use_next) — do not start Claude and fail over later.
    # MacBook strong profiles do not use Claude; no precheck there.
    strong:
      quota_precheck:
        roles: [team_lead, arbitration]
        primary_match: {cli: claude}
        metric: weekly_remaining_pct
        threshold_lt: 20
        action: use_next
        on_measure_failure: use_next
        backup_entry: {cli: copilot, model: gemini-4-argon}
        measurement:
          weekly_remaining_pct: "100 - rate_limits.seven_day.used_percentage"
          statusline_field: rate_limits.seven_day.used_percentage
          interactive_command: /usage
          interactive_note: "Current week (all models) shows used %; weekly_remaining_pct = 100 - used"
          cache_file: ~/.config/claude/gtt-weekly-remaining-pct.json
          cache_max_age_seconds: 900
          cache_schema:
            weekly_remaining_pct: integer
            observed_at: unix_epoch_seconds
      team_lead:
        - {cli: claude, model: opus, vendor: anthropic, flags: "--model opus --allowedTools Bash Read Write Edit Grep Glob"}
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --allow-tool write --allow-tool shell --allow-tool url --deny-tool 'shell(rm -rf /:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders"}
      arbitration:
        - {cli: claude, model: opus, vendor: anthropic, flags: "--model opus --allowedTools Bash Read Write Edit Grep Glob"}
        - {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --allow-tool write --allow-tool shell --allow-tool url --deny-tool 'shell(rm -rf /:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"}
    mid:
      planner: {cli: codex, model: gpt-6.1-sol, vendor: openai, context: long_context, context_window: 1000000, sandbox: danger-full-access, flags: "-m gpt-6.1-sol -c model_context_window=1000000 -s danger-full-access -a never", writes: handoff-only}
      planner_reviewer: {cli: copilot, model: gemini-4-argon, vendor: google, effort: high, context: long_context, context_window: 983k, flags: "--model gemini-4-argon --reasoning-effort high --context long_context --allow-tool write --allow-tool url --allow-tool 'shell(git:*)' --allow-tool 'shell(gh:*)' --allow-tool 'shell(env:*)' --allow-tool 'shell(python3:*)' --allow-tool 'shell(jq:*)' --allow-tool 'shell(rg:*)' --allow-tool 'shell(shasum:*)' --deny-tool 'shell(git commit:*)' --deny-tool 'shell(git push:*)' --deny-tool 'shell(git merge:*)' --deny-tool 'shell(git rebase:*)' --deny-tool 'shell(git reset:*)' --deny-tool 'shell(git checkout:*)' --deny-tool 'shell(herdr server stop:*)' --add-dir ~/Development --add-dir ~/.copilot --add-dir ~/.agents --add-dir ~/.codex --add-dir ~/orca --add-dir /tmp --add-dir /private/tmp --add-dir /var/folders --add-dir /private/var/folders --no-ask-user"}
      code_reviewer:
