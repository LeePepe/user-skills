notes:
  mac_mini_strong_claude_quota: >
    On mac-mini only, before starting strong team_lead or arbitration when the first
    profile entry is claude/opus, run quota_precheck (weekly_remaining_pct < 20 or unreadable
    → start on copilot/gemini-4-argon). See bots-and-agents.md Measurement.
  model_assignment: >
    strong uses opus with claude and gemini-4-argon with copilot;
    mid uses gpt-6.1-sol with codex and gemini-4-argon with copilot;
    worker (writer, explorer, pr_monitor, mechanical) uses copilot with gpt-5.6-luna and mai-code-2-flash only;
    writer_escalated (codex gpt-6.1-sol) is strictly reserved for V3 Round 2 fix escalation and never used for Round 1 (r1) writer dispatches;
    pr_monitor shares the exact worker model order of explorer (mai-code-2-flash -> gpt-5.6-luna) so TL delegates PR/CI status watching instead of polling inline;
    research uses gemini-4-argon with copilot and kimi with cursor-agent.
